# 复制到 /etc/nginx/sites-available/chenmo
# sudo ln -sf /etc/nginx/sites-available/chenmo /etc/nginx/sites-enabled/chenmo
# 将 resume.example.com 改为你的域名，然后 sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name resume.example.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
